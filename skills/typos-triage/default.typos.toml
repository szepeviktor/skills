[files]
extend-exclude = [
    ".git/",
    "vendor/",
    "node_modules/",
    "dist/",
    "build/",
    "public/build/",
    "coverage/",
    "composer.lock",
    "package-lock.json",
    "pnpm-lock.yaml",
    "yarn.lock",
]
ignore-hidden = false

[default]
ignore-hex = true
extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    "(#|//)\\s*spellchecker:ignore-next-line\\n.*",
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
    "\\bBig Sur\\b",
    "\\b[0-9A-Za-z/+]{64}\\b",
]

[default.extend-words]
# Extra typo corrections. Keep keys lowercase. Use same-value entries only for
# ordinary lowercase words that are intentionally accepted project-wide.
# The correction entries below are common misspellings. Remove any entry that
# is a correct domain word in the target project, for example "weather" in a
# weather application.
"contiguities" = "continuities"
"intension" = "intention"
"intensional" = "intentional"
"intensionally" = "intentionally"
"intensionaly" = "intentionally"
"pervious" = "previous"
"perviously" = "previously"
"covert" = "convert"
"metho" = "method"
"coulnd" = "couldn"
"woulnd" = "wouldn"
"shoulnd" = "shouldn"
"weather" = "whether"
"singed" = "signed"
"singing" = "signing"
"sqllite" = "sqlite"

[default.extend-identifiers]
"Automattic" = "Automattic"
"HashiCorp" = "HashiCorp"
"Symplify" = "Symplify"
"Github" = "GitHub"
"Wordpress" = "WordPress"
"Woocommerce" = "WooCommerce"
